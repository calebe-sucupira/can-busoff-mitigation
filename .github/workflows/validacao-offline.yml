name: Verificação offline

on:
  push:
    branches:
      - main
      - chore/organizar-repositorio-tcc
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Verificar sintaxe Python
        run: python3 -m compileall -q analysis experiments

      - name: Verificar lógica de throttling (C)
        run: |
          cc -std=c11 -I firmware/node-a/main analysis/testar_politica_tec_offline_TCC2.c -o /tmp/testar_politica
          /tmp/testar_politica
          cc -std=c11 -I firmware/node-a/main analysis/tests/test_throttle_dinamico.c -o /tmp/testar_dinamico
          /tmp/testar_dinamico

      - name: Testes de progressão até Bus-Off (sem hardware)
        run: |
          python3 experiments/busoff/testar_fase20_offline.py
          python3 experiments/busoff/testar_parada_busoff_offline.py
          python3 experiments/busoff/testar_campanha_integral_offline.py

      - name: Verificar planos das campanhas
        run: |
          python3 experiments/characterization/initial/executar_campanha_CAN.py --dry-run
          python3 experiments/characterization/complementary/executar_campanha_CAN_complementar.py --plan experiments/characterization/complementary/plano_ampliacao_24_ensaios_CAN_runs_197_220.csv --dry-run
          python3 experiments/characterization/complementary/executar_campanha_CAN_complementar.py
          python3 experiments/busoff/executar_campanha_CAN_phase20.py --plan experiments/busoff/plano_campanha_phase20_40_runs.csv --dry-run
          python3 experiments/busoff/executar_campanha_integral_phase20.py --dry-run

      - name: Auditar evidencias e valores das campanhas
        run: python3 analysis/validar_integridade_campanhas.py

      - name: Conferir dados preservados
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          for run in list(range(153, 189)) + list(range(197, 221)):
              p = Path(f"data/zips/run_{run}_injection.zip")
              assert p.is_file(), f"Arquivo ausente: {p}"

          modes = []
          for run in range(304, 344):
              root = Path(f"data/busoff_estudo_2026/raw/run_{run}_injection")
              meta = json.loads((root / "metadata.json").read_text())
              assert meta["run"] == run, f"Identificador divergente: {run}"
              modes.append(meta["condition"])
              assert (root / "node_a.log").is_file()
              assert (root / "node_b.log").is_file()
              assert (root / "pico.log").is_file()
              p = Path(f"data/busoff_estudo_2026/zips/run_{run}_injection.zip")
              assert p.is_file(), f"Arquivo ausente: {p}"

          assert modes.count("REFERENCIA") == 20
          assert modes.count("ADAPTATIVO") == 20
          trace = Path("experiments/busoff/node_a_busoff_trace.c")
          assert trace.is_file()
          assert '"node-a-throttling-v1.3-busoff-trace"' in trace.read_text()
          assert not Path("firmware.zip").exists()
          print("Planos, registros e arquivos compactados encontrados.")
          PY
